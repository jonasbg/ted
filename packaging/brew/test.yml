name: Test Homebrew installation
on:
  push:
    paths: [Formula/ted.rb, '.github/workflows/brew.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@master
      - run: |
          brew tap jonasbg/omarchy https://github.com/jonasbg/omarchy
          brew install jonasbg/omarchy/ted
          brew test jonasbg/omarchy/ted
